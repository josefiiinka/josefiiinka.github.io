<div class="language-switcher">
  <a href="{{ '/' | relative_url }}" class="lang-link {% if page.lang == 'en' %}active{% endif %}" title="English">
    <span class="lang-flag">🇬🇧</span>
    <span class="lang-text">EN</span>
  </a>
  <a href="{{ '/cs/' | relative_url }}" class="lang-link {% if page.lang == 'cs' %}active{% endif %}" title="Čeština">
    <span class="lang-flag">🇨🇿</span>
    <span class="lang-text">CS</span>
  </a>
</div>

<style>
  .language-switcher {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 1000;
    display: flex;
    gap: 5px;
    background: rgba(255, 255, 255, 0.9);
    padding: 5px 10px;
    border-radius: 20px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    font-size: 14px;
  }

  .lang-link {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #333;
    text-decoration: none;
    padding: 4px 8px;
    border-radius: 15px;
    transition: all 0.2s ease;
  }

  .lang-link:hover {
    background: rgba(0, 0, 0, 0.05);
  }

  .lang-link.active {
    background: #007acc;
    color: white;
  }

  .lang-flag {
    font-size: 16px;
  }

  .lang-text {
    font-weight: 500;
  }
</style>
