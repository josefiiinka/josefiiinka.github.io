remote_theme: pages-themes/slate@v0.2.0
plugins:
- jekyll-remote-theme
- jekyll-seo-tag

# Default language
default_lang: cs

# Site settings
title: Mama Rafiki

author:
  name: Josefína Drbálková
  url: https://mamarafiki.cz/cs/

# Language-specific descriptions
descriptions:
  en: "Your stories reveal to me paths that cannot be found on any map."
  cs: ""

# Languages
languages:
  - en
  - cs

# Language names
language_names:
  en: English
  cs: Čeština

# URL structure
url: "https://mamarafiki.cz"
permalink: /:lang/:title/

# Collections for i18n
i18n:
  collections:
    - posts
    - pages

# Exclude from processing
exclude:
  - README.md
  - AGENTS.md
  - scripts
  - tests
  - .gitignore
  - .DS_Store

# Public GoatCounter site identifier
goatcounter_code: mamarafiki
