remote_theme: pages-themes/slate@v0.2.0
plugins:
- jekyll-remote-theme

# Default language
default_lang: en

# Site settings
title: Mama Rafiki
description: "Your stories reveal to me paths that cannot be found on any map."

# Languages
languages:
  - en
  - cs

# Language names
language_names:
  en: English
  cs: Čeština

# URL structure
permalink: /:lang/:title/

# Collections for i18n
i18n:
  collections:
    - posts
    - pages

# Exclude from processing
exclude:
  - README.md
  - .gitignore
  - .DS_Store
