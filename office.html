<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mamarafiki Office</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0eb;color:#25313b;font:16px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:28px 18px}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}h1{font-size:clamp(18px,4.6vw,30px);letter-spacing:.08em;white-space:nowrap;margin:0;font-weight:800}h2,summary{font-size:18px;margin:0 0 12px;font-weight:600}summary{cursor:pointer}section{background:white;border:1px solid #dde1df;border-radius:16px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid section{margin:0}.grid{margin-bottom:18px}button{font:inherit;cursor:pointer;background:#536f7c;color:white;border:0;border-radius:8px;padding:8px 14px;min-height:40px}button:disabled{opacity:.5;cursor:wait}.icon{background:transparent;color:#536f7c;padding:0 8px;min-width:36px;font-size:21px;vertical-align:middle}input,textarea{font:inherit;border:1px solid #aab7bb;border-radius:8px;padding:10px;max-width:100%;background:white;color:#25313b}input[type=checkbox]{width:20px;height:20px;accent-color:#536f7c;flex-shrink:0}textarea{width:100%;resize:vertical;min-height:100px}.editor{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin:10px 0}.editor input{flex:1;min-width:100px}.question{margin:16px 0}.notes{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0}.answer:empty{display:none}.item{display:flex;flex-wrap:wrap;gap:7px;align-items:baseline;padding:8px 0;border-bottom:1px solid #eee}.itembody{flex:1;min-width:100px}.item summary{font-size:16px}.goal{background:#6c8794;color:white}.goal .icon{color:white}#goal{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#goal>span{flex:1;font-size:22px}#status{min-height:26px;font-size:14px}footer{display:flex;gap:12px;margin-top:20px}footer button{background:transparent;color:#536f7c}#login{max-width:450px;margin:40px auto}#login label{display:block;margin:12px 0}#login input{width:100%}[hidden]{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}}:focus-visible{outline:3px solid #30566c;outline-offset:3px}
</style></head><body><main><header><h1>MAMARAFIKI OFFICE</h1><span id="date"></span></header><p id="status" role="status" aria-live="polite"></p><section id="login"><form id="loginForm"><h2>Přihlášení</h2><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Heslo<input id="password" type="password" autocomplete="current-password" required></label><button id="loginButton" type="submit">Přihlásit</button></form></section><div id="app" hidden><section class="goal"><h2>Měsíční cíl</h2><div id="goal"></div></section><div class="grid"><section><h2>Rutina</h2><div id="tasks"></div><button id="addTask" aria-label="Přidat rutinu">+</button></section><section><h2>Nápady na články</h2><div id="ideas"></div><button id="addIdea" aria-label="Přidat nápad">+</button></section></div><section><details><summary>Děti z mojí družiny</summary><div id="children"></div><button id="addChild" aria-label="Přidat dítě, první řádek jméno, další řádky poznámky">+</button></details></section><section><h2 id="reflectionTitle">Reflexe</h2><div id="questions"></div></section><section><details><summary>Reflexe</summary><div id="archive"></div></details></section><footer><button id="export">Export</button><button id="logout">Odhlásit</button></footer></div><noscript>Pro přihlášení a ukládání zapni JavaScript.</noscript></main><script>
const URL='https://efyjfalrnemdhqxqtcjc.supabase.co', KEY='sb_publishable_8cBXQFvJP2-muETRILUl2A_Mazr68zw', OWNER='2abd6c11-bd86-4e6f-87af-9377f6f04486';
const $=id=>document.getElementById(id);
let session=null, rows=[], pending=0, drafts=new Set();
const questions=['Co se mi dnes podařilo?','Jaký svůj talent nebo silnou stránku jsem dnes zahlédla?','Co mi dnes udělalo radost?','Co mi dnes vzalo energii?','Co bych zítra chtěla udělat jinak?'];
const day=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const pretty=d=>new Intl.DateTimeFormat('cs-CZ',{dateStyle:'long'}).format(new Date(d+'T12:00:00'));
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function button(text,label,fn){const b=el('button',text,'icon');b.type='button';b.setAttribute('aria-label',label);b.title=label;b.onclick=fn;return b;}
function notice(s){$('status').textContent=s;}
async function request(path,opts={}){
 if(!session)throw Error('Přihlas se prosím.');
 if(Date.now()>session.until-60000){
  const r=await fetch(URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
  if(!r.ok)throw Error('Přihlášení vypršelo. Obnov stránku a přihlas se.');
  session=await r.json();session.until=Date.now()+session.expires_in*1000;
 }
 const r=await fetch(URL+path,{...opts,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...opts.headers}});
 if(!r.ok)throw Error('Uložení nebo načtení selhalo ('+r.status+'). Zkus to znovu.');
 return r.status===204?null:r.json();
}
function find(category,key){return rows.find(r=>r.category===category&&r.entry_key===key);}
async function put(category,key,content,date=null){
 pending++;notice('Ukládám…');
 try{
 const data=await request('/rest/v1/office_entries?on_conflict=owner_id,category,entry_key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify({owner_id:OWNER,category,entry_key:key,entry_date:date,content,updated_at:new Date().toISOString()})});
 if(!data||!data[0])throw Error('Uložení se nepotvrdilo.');
 rows=rows.filter(r=>r.id!==data[0].id);rows.push(data[0]);notice('Uloženo');return data[0];
 }catch(e){notice(e.message);throw e;}finally{pending--;}
}
async function remove(r){
 if(!confirm('Smazat tento zápis?'))return;
 pending++;
 try{const deleted=await request('/rest/v1/office_entries?id=eq.'+r.id,{method:'DELETE',headers:{Prefer:'return=representation'}});if(!deleted?.length)throw Error('Smazání se nepotvrdilo.');rows=rows.filter(x=>x.id!==r.id);renderLists();renderArchive();notice('Smazáno');}catch(e){notice(e.message);}finally{pending--;}
}
function editor(parent,value,onSave,multiline=false){
 if(parent.querySelector('.editor'))return;
 const wrap=el('form',undefined,'editor'), input=el(multiline?'textarea':'input');
 input.value=value;input.setAttribute('aria-label','Text');if(multiline)input.rows=4;
 const token={};input.oninput=()=>drafts.add(token);
 const save=el('button','✓');save.type='submit';save.setAttribute('aria-label','Uložit');
 const cancel=button('×','Zrušit',()=>{drafts.delete(token);wrap.remove();});
 wrap.append(input,save,cancel);parent.append(wrap);input.focus();
 wrap.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{await onSave(input.value);drafts.delete(token);wrap.remove();}catch(err){notice(err.message);}finally{save.disabled=false;}};
}
function list(category,target){
 const root=$(target);root.replaceChildren();
 for(const r of rows.filter(x=>x.category===category).sort((a,b)=>a.created_at.localeCompare(b.created_at))){
 const item=el('div',undefined,'item');
 if(category==='task'){
 const check=el('input');check.type='checkbox';check.checked=!!find('task_done',day()+':'+r.entry_key)?.content.done;check.setAttribute('aria-label',r.content.text||'Splněno');
 check.onchange=async()=>{check.disabled=true;try{await put('task_done',day()+':'+r.entry_key,{done:check.checked},day());}catch{check.checked=!check.checked;}finally{check.disabled=false;}};
 item.append(check);
 }
 const label=el(category==='child'?'details':'div',undefined,'itembody');
 if(category==='child'){label.append(el('summary',r.content.name||'Dítě'),el('p',r.content.notes||'','notes'));}
 else label.append(el('span',r.content.text||'','notes'));
 item.append(label,button('✎','Upravit',()=>editor(item,category==='child'?(r.content.name+'\n'+(r.content.notes||'')):r.content.text,async v=>{
 const content=category==='child'?childContent(v):{text:v};if(!v.trim())throw Error('Text je prázdný.');await put(category,r.entry_key,content);renderLists();
 },category!=='task')),button('×','Smazat',()=>remove(r)));
 root.append(item);
 }
}
function childContent(v){const [name,...notes]=v.split('\n');return {name:name.trim(),notes:notes.join('\n')};}
function add(category,target){editor($(target).parentElement,'',async v=>{if(!v.trim())return;await put(category,crypto.randomUUID(),category==='child'?childContent(v):{text:v});renderLists();},category==='child');}
function renderLists(){list('task','tasks');list('idea','ideas');list('child','children');}
function renderReflection(){
 const d=day(), weekday=new Date(d+'T12:00:00').getDay();
 $('reflectionTitle').textContent=['Nedělní','Pondělní','Úterní','Středeční','Čtvrteční','Páteční','Sobotní'][weekday]+' reflexe';
 const root=$('questions');root.replaceChildren();
 questions.forEach((q,i)=>{
 const key=d+':'+i, old=find('reflection',key), item=el('div',undefined,'question'), answer=el('p',old?.content.answer||'','notes answer');
 item.append(el('span',(i+1)+'. '+(old?.content.question||q)),button('✎','Odpovědět na otázku '+(i+1),()=>editor(item,find('reflection',key)?.content.answer||'',async v=>{
 await put('reflection',key,{question:old?.content.question||q,answer:v,index:i},d);answer.textContent=v;renderArchive();
 },true)),answer);root.append(item);
 });
}
function renderArchive(){
 const root=$('archive');root.replaceChildren();
 const dates=[...new Set(rows.filter(r=>r.category==='reflection').map(r=>r.entry_date).filter(Boolean))].sort().reverse();
 for(const d of dates){const detail=el('details');detail.append(el('summary',pretty(d)));
 for(const r of rows.filter(r=>r.category==='reflection'&&r.entry_date===d).sort((a,b)=>(a.content.index||0)-(b.content.index||0))){
 const line=el('div',undefined,'question');line.append(el('span',r.content.question||'Reflexe'));
 if(r.content.answers)line.append(el('p',r.content.answers.join('\n'),'notes'));
 else{
 const answer=el('p',r.content.answer||'','notes');line.append(button('✎','Upravit odpověď',()=>editor(line,r.content.answer||'',async v=>{await put('reflection',r.entry_key,{...r.content,answer:v},d);answer.textContent=v;r.content.answer=v;},true)),answer);
 }
 detail.append(line);
 }root.append(detail);}
}
function renderGoal(){
 const key=day().slice(0,7), root=$('goal');root.replaceChildren();
 const r=find('goal',key), title=el('span',r?.content.text||'Každý den chvíli cvičit.');
 const check=el('input');check.type='checkbox';check.setAttribute('aria-label','Dnešní cíl splněn');check.checked=!!find('goal_done',day())?.content.done;
 check.onchange=async()=>{check.disabled=true;try{await put('goal_done',day(),{done:check.checked},day());}catch{check.checked=!check.checked;}finally{check.disabled=false;}};
 root.append(check,title,button('✎','Upravit měsíční cíl',()=>editor(root,title.textContent,async v=>{await put('goal',key,{text:v});title.textContent=v;})));
}
async function load(){
 rows=[];let offset=0;
 while(true){const page=await request('/rest/v1/office_entries?select=*&order=id&limit=500&offset='+offset);rows.push(...page);if(page.length<500)break;offset+=500;}
 $('date').textContent=pretty(day());renderGoal();renderLists();renderReflection();renderArchive();
}
$('loginForm').onsubmit=async e=>{
 e.preventDefault();$('loginButton').disabled=true;notice('Přihlašuji…');
 try{
 const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});
 if(!r.ok){
 const err=await r.json().catch(()=>({}));
 const code=err.code||err.error_code||'';
 const messages={
 invalid_credentials:'Nesprávný e-mail nebo heslo. Použij účet vytvořený v Authentication → Users.',
 email_not_confirmed:'E-mail není potvrzený. V Supabase otevři Authentication → Users a zkontroluj potvrzení svého účtu.',
 user_banned:'Přístup účtu je zablokovaný.',
 over_request_rate_limit:'Příliš mnoho pokusů. Zkus přihlášení za chvíli.',
 email_provider_disabled:'Přihlášení e-mailem je vypnuté.'
 };
 throw Error(messages[code]||('Přihlášení se nezdařilo (HTTP '+r.status+(code?', '+code:'')+').'));
 }
 const data=await r.json();if(data.user?.id!==OWNER)throw Error('Tento účet nemá přístup.');
 session=data;session.until=Date.now()+session.expires_in*1000;
 await load();$('password').value='';$('login').hidden=true;$('app').hidden=false;notice('');
 }catch(e){session=null;notice(e.message);}finally{$('loginButton').disabled=false;}
};
$('logout').onclick=async()=>{
 if((drafts.size||pending)&&!confirm('Některé změny ještě nejsou uložené. Odhlásit se?'))return;
 try{await request('/auth/v1/logout',{method:'POST'});}catch{}
 location.reload();
};
$('export').onclick=()=>{
 const blob=new Blob([JSON.stringify({version:1,exported_at:new Date().toISOString(),entries:rows},null,2)],{type:'application/json'});
 const url=window.URL.createObjectURL(blob), a=el('a');a.href=url;a.download='mamarafiki-'+day()+'.json';a.click();setTimeout(()=>window.URL.revokeObjectURL(url),1000);
};
window.addEventListener('beforeunload',e=>{if(pending||drafts.size){e.preventDefault();e.returnValue='';}});
$('addTask').onclick=()=>add('task','tasks');$('addIdea').onclick=()=>add('idea','ideas');$('addChild').onclick=()=>add('child','children');
</script></body></html>
